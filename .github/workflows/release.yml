name: Release
# Merging a version bump releases it: each push to main checks whether the
# Cargo.toml version already has a tag, and only an untagged version builds.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Queue overlapping runs so a second merge sees the tag the first one created.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists; nothing to release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "$tag is new; building a draft release."
          fi
  build:
    needs: version
    # A manual run always builds, as downloadable artifacts only.
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            executable: mcp-brain
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: mcp-brain
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: mcp-brain
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: mcp-brain.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from rust-toolchain.toml; musl and MSVC targets
      # are cross builds that Nix does not cover on every runner.
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test target
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist package
          cp "target/$TARGET/release/mcp-brain" README.md CONTRIBUTING.md SECURITY.md LICENSE package/
          cp -R docs package/docs
          tar -czf "dist/mcp-brain-$TARGET.tar.gz" -C package .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Path dist,package
          Copy-Item "target/$env:TARGET/release/mcp-brain.exe",README.md,CONTRIBUTING.md,SECURITY.md,LICENSE -Destination package
          Copy-Item docs -Destination package/docs -Recurse
          Compress-Archive -Path package/* -DestinationPath "dist/mcp-brain-$env:TARGET.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-brain-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'push' && needs.version.outputs.new == 'true'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum mcp-brain-* > SHA256SUMS
      # A draft does not create its tag until published, so create it here:
      # the next push to main then sees the version as released.
      - name: Tag and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
