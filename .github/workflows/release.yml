name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            executable: mcp-brain
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: mcp-brain
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: mcp-brain
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: mcp-brain.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.93.0 --profile minimal --target ${{ matrix.target }}
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test target
        run: cargo +1.93.0 test --locked --target ${{ matrix.target }}
      - name: Build release
        run: cargo +1.93.0 build --locked --release --target ${{ matrix.target }}
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist package
          cp "target/$TARGET/release/mcp-brain" README.md CONTRIBUTING.md SECURITY.md LICENSE package/
          cp -R docs package/docs
          tar -czf "dist/mcp-brain-$TARGET.tar.gz" -C package .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Path dist,package
          Copy-Item "target/$env:TARGET/release/mcp-brain.exe",README.md,CONTRIBUTING.md,SECURITY.md,LICENSE -Destination package
          Copy-Item docs -Destination package/docs -Recurse
          Compress-Archive -Path package/* -DestinationPath "dist/mcp-brain-$env:TARGET.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-brain-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum mcp-brain-* > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
