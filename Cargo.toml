[package]
name = "mcp-brain"
version = "0.5.0"
edition = "2024"
rust-version = "1.100"
authors = ["Benoit TRAVERS <benoit.travers.fr@gmail.com>"]
description = "Ownership-aware MCP memory for local Markdown and Obsidian PARA vaults"
license = "MIT"
repository = "https://github.com/btravers/mcp-brain"
readme = "README.md"

[dependencies]
anyhow = "1"
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm_0_29", "unstable-rendered-line-info"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "transport-io"] }
rust-stemmers = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tui-markdown = { version = "0.3.12", default-features = false }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
yaml_serde = "0.10"

[dev-dependencies]
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-child-process"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", features = ["accelerate"] }
candle-nn = { version = "0.11.1", features = ["accelerate"] }
candle-transformers = { version = "0.11.1", features = ["accelerate"] }
